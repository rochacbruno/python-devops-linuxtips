---
apiVersion: v1
kind: Pod
metadata:
  name: mailhog
  labels:
    app: mailhog
spec:
  containers:
    - name: mailhog
      image: mailhog/mailhog
      ports:
        - containerPort: 1025  # SMTP
        - containerPort: 8025  # Web UI
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
spec:
  type: NodePort
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
  selector:
    app: mailhog
