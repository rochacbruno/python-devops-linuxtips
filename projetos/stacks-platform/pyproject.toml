[project]
name = "stacks-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bruno Cesar Rocha", email = "rochacbruno@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cdktf>=0.21.0",
    "cdktf-cdktf-provider-docker>=12.0.2",
    "constructs>=10.4.3",
    "cyclopts>=4.3.0",
    "fastapi>=0.123.8",
    "flet[all]>=0.28.3",
    "httpx>=0.28.1",
    "pip>=25.3",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "textual>=6.7.1",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
stacks = "stacks_cli.main:cli"
stacks-api = "stacks_api.main:run"
stacks-tui = "stacks_tui.main:run"
stacks-web = "stacks_web.main:web"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stacks_core", "src/stacks_api", "src/stacks_cli", "src/stacks_tui", "src/stacks_web"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.8.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.8",
    "textual-dev>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
